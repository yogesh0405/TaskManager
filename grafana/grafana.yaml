apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'taskmanager-dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards

  taskmanager-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {},
          "pluginVersion": "9.x",
          "targets": [ { "expr": "up{job=\"task-manager\"}", "refId": "A" } ],
          "title": "Application Availability (up)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {},
          "pluginVersion": "9.x",
          "targets": [ { "expr": "rate(task_manager_http_requests_total[1m])", "refId": "A" } ],
          "title": "HTTP Requests per second (rate)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 6},
          "id": 3,
          "options": {},
          "pluginVersion": "9.x",
          "targets": [ { "expr": "process_resident_memory_bytes", "refId": "A" } ],
          "title": "Process Resident Memory (bytes)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 6},
          "id": 4,
          "options": {},
          "pluginVersion": "9.x",
          "targets": [ { "expr": "nodejs_heap_size_used_bytes", "refId": "A" } ],
          "title": "Node.js Heap Used (bytes)",
          "type": "timeseries"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": [ "task-manager" ],
      "templating": { "list": [] },
      "time": { "from": "now-5m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Task Manager - Prometheus Metrics",
      "uid": "taskmanager-dashboard",
      "version": 1
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:9.5.10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards-files
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
            items:
              - key: prometheus.yaml
                path: prometheus.yaml
        - name: grafana-dashboards-provisioning
          configMap:
            name: grafana-dashboards
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: grafana-dashboards-files
          configMap:
            name: grafana-dashboards
            items:
              - key: taskmanager-dashboard.json
                path: taskmanager-dashboard.json

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
